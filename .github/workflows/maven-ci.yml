name: Hợp Thể Assignment (Bai 3 -> Bai 7)

on:
  push:
    branches: [ "main", "master" ]
  # --- [BÀI 7] Trigger khi có Pull Request vào nhánh main ---
  pull_request:
    branches: [ "main", "master" ]

# Cấp quyền cho Bot có thể viết bình luận vào Pull Request
permissions:
  contents: read
  pull-requests: write

jobs:
  build-and-review:
    # --- [BÀI 4] Chạy trên 3 hệ điều hành ---
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v3

      # --- [BÀI 6] Caching để tăng tốc cho tất cả các bài ---
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      # --- [BÀI 3] Build cơ bản ---
      - name: Bai 3 - Build & Jar
        working-directory: ./Bai3
        run: mvn clean package

      # --- [BÀI 4] Test đa hệ điều hành ---
      - name: Bai 4 - Cross-OS Test
        working-directory: ./Bai4
        run: mvn test

      # --- [BÀI 5] Ép chất lượng 80% (Strict Rule) ---
      - name: Bai 5 - JaCoCo 80%
        working-directory: ./Bai5
        run: mvn clean verify

      # --- [BÀI 7] AUTOMATED CODE REVIEW (Checkstyle) ---
      # Bước 1: Chạy Checkstyle để quét lỗi định dạng
      - name: Bai 7 - Run Checkstyle
        working-directory: ./Bai7
        run: mvn checkstyle:checkstyle

      # Bước 2: Bot tự động "mắng" nếu có lỗi (Chỉ chạy trên Ubuntu để tránh spam comment)
      - name: Bai 7 - Inline Feedback
        if: matrix.os == 'ubuntu-latest' && github.event_name == 'pull_request'
        uses: dbelyaev/action-checkstyle@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          level: warning
          # Đường dẫn tới file báo cáo của Bài 7
          checkstyle_config: google_checks.xml
          workdir: Bai7