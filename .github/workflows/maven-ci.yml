name: Hợp Thể Pipeline (Bai 3 -> Bai 10)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-review:
    runs-on: ubuntu-latest

    steps:
      # --- [BAI 3]: Checkout mã nguồn từ GitHub ---
      - name: Checkout code
        uses: actions/checkout@v4

      # --- [BAI 3]: Cài đặt môi trường Java JDK 17 ---
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # --- [BAI 7]: Tự động Review Code (Checkstyle) ---
      # Bước này sẽ soi lỗi format và comment trực tiếp vào Pull Request
      - name: Run Checkstyle Reviewdog
        uses: dbelyaev/action-checkstyle@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          level: warning
          reporter: github-pr-review
          filter_mode: added
          checkstyle_config: google_checks.xml

      # --- [BAI 3, 5, 10]: Thực hiện Build và chạy Unit Test ---
      # Đây là nơi "Broken Pipeline" của Bài 10 sẽ đỏ nếu Duy Anh chưa sửa lỗi
      - name: Build with Maven (Compile & Test)
        run: mvn clean package

      # --- [BAI 8]: Đóng gói và lưu trữ sản phẩm (JAR file) ---
      # Sau khi build xong, file JAR sẽ được đưa lên tab Artifacts để tải về
      - name: Upload Executable JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: shipping-calculator-jar
          path: target/*.jar

      # --- [BAI 9]: Lưu trữ nhật ký hệ thống (Logging) ---
      # Lưu lại file log vật lý để kiểm tra sau khi chạy test
      - name: Upload System Logs
        if: always() # Luôn chạy kể cả khi test fail để xem log lỗi
        uses: actions/upload-artifact@v4
        with:
          name: system-logs
          path: logs/*.log